<ossec_config>
  <client>
    <server>
      <address>192.168.56.10</address>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows-common, windows-10</config-profile>
  </client>

  <!-- Log monitoring for Windows Security Event Logs -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Monitoring PowerShell execution logs for suspicious activity -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</ossec_config>
